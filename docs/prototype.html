<title>OneWallet 原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* 布局：左侧页面目录 + 居中的手机画框；窄屏时目录收成下拉框。视觉方向 A「沉稳金融」。 */
:root{
  --page:#E4E8EE; --bg:#F1F3F7; --surface:#FFFFFF; --ink:#16202E; --muted:#5E6B7D; --line:#DCE2EA;
  --brand:#1F3A5F; --brand-ink:#FFFFFF; --brand-soft:#E6ECF4;
  --up:#1B7F52; --down:#C2362B; --warn:#A8690F;
  --up-soft:#E2F2EA; --down-soft:#FBE7E4; --warn-soft:#FAEFD9;
  --sans:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#080C12; --bg:#0E141C; --surface:#17202B; --ink:#E6ECF3; --muted:#93A1B3; --line:#263241;
  --brand:#8DB4E2; --brand-ink:#0E141C; --brand-soft:#1D2A3A;
  --up:#4CC38A; --down:#F0766B; --warn:#E0A84A;
  --up-soft:#173326; --down-soft:#3A1D1A; --warn-soft:#382B12; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#080C12; --bg:#0E141C; --surface:#17202B; --ink:#E6ECF3; --muted:#93A1B3; --line:#263241;
  --brand:#8DB4E2; --brand-ink:#0E141C; --brand-soft:#1D2A3A;
  --up:#4CC38A; --down:#F0766B; --warn:#E0A84A;
  --up-soft:#173326; --down-soft:#3A1D1A; --warn-soft:#382B12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,390px);gap:28px;justify-content:center;align-items:start}
.side h1{font-size:18px;margin:0 0 2px;font-weight:600}
.side p{margin:0 0 14px;color:var(--muted);font-size:12.5px}
.idx{display:flex;flex-direction:column;gap:1px}
.idx button{all:unset;cursor:pointer;padding:5px 8px;border-radius:6px;font-size:13px;display:flex;gap:8px;color:var(--ink)}
.idx button span{font-family:var(--mono);color:var(--muted);font-size:11.5px;width:28px;flex:none;padding-top:1px}
.idx button:hover{background:var(--brand-soft)}
.idx button.on{background:var(--brand);color:var(--brand-ink)}
.idx button.on span{color:var(--brand-ink);opacity:.75}
.idx button:focus-visible,.tap:focus-visible,.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#jump{display:none;width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.phone{background:var(--bg);border:1px solid var(--line);border-radius:28px;height:760px;max-height:calc(100vh - 60px);min-height:560px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.bar{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;flex:none}
.bar h2{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--brand);font-size:18px}
.ico:hover{background:var(--brand-soft)}
.body{flex:1;overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
.body>*{flex:none}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface)}
.tabs button{all:unset;cursor:pointer;text-align:center;padding:10px 0 12px;font-size:12px;color:var(--muted)}
.tabs button.on{color:var(--brand);font-weight:600;box-shadow:inset 0 2px 0 var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-size:28px;font-weight:600;letter-spacing:-.5px}
.muted{color:var(--muted);font-size:12.5px}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);min-height:54px}
.row:first-child{border-top:0}
.tap{cursor:pointer}.tap:hover{background:var(--brand-soft)}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.dot{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--brand-soft);color:var(--brand);font-family:var(--mono)}
.sq{border-radius:7px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:500}
.pill.g{background:var(--up-soft);color:var(--up)}.pill.r{background:var(--down-soft);color:var(--down)}.pill.o{background:var(--warn-soft);color:var(--warn)}
.sec{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:4px 2px -6px}
.seg{display:flex;background:var(--brand-soft);border-radius:8px;padding:3px;gap:3px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:6px 4px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:500}
.btn{all:unset;cursor:pointer;display:block;text-align:center;padding:12px;border-radius:var(--r);background:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
.btn.sm{display:inline-block;padding:5px 10px;font-size:12.5px;font-weight:500;border-radius:7px}
.btn.danger{background:transparent;color:var(--down);border:1px solid var(--line)}
.note{border-radius:var(--r);padding:10px 12px;font-size:12.5px;background:var(--warn-soft);color:var(--warn);display:flex;gap:8px;align-items:center}
.note.info{background:var(--brand-soft);color:var(--ink)}
.note.red{background:var(--down-soft);color:var(--down)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--muted)}
.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit;width:100%;min-width:0}
.share{height:4px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.share i{display:block;height:100%;background:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12.5px;background:var(--surface)}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:500}
.words{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.words div{border:1px solid var(--line);border-radius:7px;padding:7px 8px;font-family:var(--mono);font-size:12.5px;background:var(--surface);white-space:nowrap;overflow:hidden}
.words div i{font-style:normal;color:var(--muted);margin-right:5px}
.veil{border:1px dashed var(--line);border-radius:var(--r);padding:28px 14px;text-align:center;background:repeating-linear-gradient(135deg,var(--surface) 0 8px,var(--bg) 8px 16px)}
.lock{display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:70px}
.pins{display:flex;gap:14px}.pins i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--brand)}.pins i.f{background:var(--brand)}
.pad{display:grid;grid-template-columns:repeat(3,68px);gap:14px}
.pad button{all:unset;cursor:pointer;height:60px;border-radius:50%;text-align:center;font-size:22px;font-family:var(--mono);background:var(--surface);border:1px solid var(--line)}
.pad button:hover{background:var(--brand-soft)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0}
.steps{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps .card{display:flex;gap:10px;align-items:flex-start}
.steps .card::before{counter-increment:s;content:counter(s);font-family:var(--mono);width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:12px;flex:none}
.ex{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
svg text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,390px)}.idx{display:none}#jump{display:block}.side p{margin-bottom:8px}}
@media (prefers-reduced-motion:no-preference){.body{scroll-behavior:smooth}}
</style>

<div class="wrap">
  <div class="side">
    <h1>OneWallet 原型</h1>
    <p>点击手机画面里的内容可以跳转；也可以从目录直接打开某一页。画面中的数字、地址和助记词都是示例。</p>
    <select id="jump" aria-label="跳转到页面"></select>
    <div class="idx" id="idx"></div>
  </div>
  <div>
    <div class="phone" id="phone"></div>
    <div class="ex">示例数据 · 窄屏（手机）布局 · 视觉方向 A</div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const PAGES=[
 ['lock','P00','解锁'],['onboard','P01','首次引导'],['overview','P02','总览'],['accounts','P03','账户列表'],
 ['add','P04','添加账户'],['addwallet','P05','观察链上地址'],['addex','P06','连接交易所'],['wallet','P07','钱包账户详情'],
 ['exchange','P08','交易所账户详情'],['asset','P09','币种详情'],['book','P10','地址簿'],['checklist','P11','备份清单'],
 ['vault','P12','保险库'],['master','P13','设置主密码'],['import','P14','导入密钥'],['key','P15','密钥详情'],
 ['derive','P16','派生地址'],['backup','P17','加密备份'],['settings','P18','设置'],['security','P19','安全设置'],
 ['sources','P20','数据源'],['sync','P21','同步状态'],['about','P22','关于与帮助']];
const ROOT={overview:'总览',accounts:'账户',vault:'保险库',settings:'设置'};
const TABOF={book:'accounts'};
let stack=['overview'],st={dist:'coin',wtab:'assets',reveal:false,pin:0,range:30,t:60};
let timer=null;

const usd=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const COINS=[['BTC','1.2034',82100.4,64],['ETH','8.51',25300.12,20],['USDT','15,020.50',15023.5,12],['SOL','22.4',3900.3,3],['ARB','5,200',2126,1]];
const ACCTS=[['Uni 钱包','Uniswap Wallet',32100.55,'wallet','g','已入库'],['小狐狸主号','MetaMask',8420.1,'wallet','r','未备份'],['Bitget 无私钥','Bitget Wallet',1050,'wallet','o','无助记词'],['Binance 主账户','Binance',60200.1,'exchange'],['OKX','OKX',20879.57,'exchange','x']];
const TOTAL=128450.32;

const bar=(t,o={})=>`<div class="bar">${o.back?'<button class="ico" data-back aria-label="返回">‹</button>':''}<h2>${t}</h2>${o.lock?'<span class="pill o">敏感页面</span>':''}${o.right||''}</div>`;
const row=(a,t,s,r,go,sq)=>`<div class="row ${go?'tap':''}" ${go?`data-go="${go}" tabindex="0" role="button"`:''}>${a?`<div class="dot ${sq?'sq':''}">${a}</div>`:''}<div class="m"><b>${t}</b><span class="muted">${s||''}</span></div><div class="r">${r||''}</div></div>`;
const chev='<span class="muted">›</span>';

function chart(){
  const n=st.range,d=[];let v=118000;
  for(let i=0;i<n;i++){v+=Math.sin(i*1.3)*900+Math.cos(i*.45)*1400+ (TOTAL-118000)/n*0.9;d.push(v)}
  d[n-1]=TOTAL;const lo=Math.min(...d),hi=Math.max(...d),W=326,H=110,L=44,T=8,B=18;
  const x=i=>L+(W-L-6)*i/(n-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const p=d.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="近 ${n} 天净值曲线">
  <line x1="${L}" x2="${W-6}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--line)" fill="none"/><line x1="${L}" x2="${W-6}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line)" fill="none"/>
  <text x="0" y="${y(hi)+3}">${(hi/1000).toFixed(1)}k</text><text x="0" y="${y(lo)+3}">${(lo/1000).toFixed(1)}k</text>
  <polygon points="${L},${y(lo)} ${p} ${x(n-1)},${y(lo)}" fill="var(--brand-soft)"/>
  <polyline points="${p}" fill="none" stroke="var(--brand)" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="${x(n-1)}" cy="${y(TOTAL)}" r="3.5" fill="var(--brand)"/>
  <text x="${L}" y="${H-3}">${n} 天前</text><text x="${W-6}" y="${H-3}" text-anchor="end">今天</text></svg>`;
}

const S={
lock:()=>`<div class="body"><div class="lock"><div class="dot sq" style="width:56px;height:56px;font-size:20px">OW</div><b style="font-size:17px">OneWallet</b>
 <div class="pins">${[0,1,2,3,4,5].map(i=>`<i class="${i<st.pin?'f':''}"></i>`).join('')}</div><span class="muted">输入 6 位 PIN（原型中任意数字即可）</span>
 <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-pin>${n}</button>`).join('')}<button data-go="overview" style="font-size:13px">面容</button><button data-pin>0</button><button data-pinback style="font-size:16px">⌫</button></div></div></div>`,

onboard:()=>bar('欢迎使用')+`<div class="body"><div class="card"><b style="font-size:16px">一处看全，备份不丢</b><p class="muted" style="margin:6px 0 0">查看所有链上钱包和交易所的资产，并把助记词存进本机的加密保险库。</p></div>
 <div class="sec">开始前请了解</div><div class="list">${row('1','只读，不转账','app 不会发起任何交易')}${row('2','密钥只存在这台手机','不上传到任何服务器')}${row('3','PIN 和主密码无法找回','请务必记牢，并导出加密备份')}</div>
 <div class="steps"><div class="card"><div><b>设置 6 位 PIN</b><div class="muted">输入两次确认</div></div></div><div class="card"><div><b>开启面容或指纹</b><div class="muted">可跳过</div></div></div></div>
 <button class="btn" data-go="lock">我已了解，开始使用</button><button class="btn ghost" data-go="backup">从备份恢复</button></div>`,

overview:()=>bar('总览',{right:'<button class="ico" aria-label="隐藏金额">◐</button><button class="ico" data-go="add" aria-label="添加账户">＋</button>'})+`<div class="body">
 <div class="card"><div class="muted">总资产（USD）</div><div class="num big">${usd(TOTAL)}</div><div class="num up">▲ +1,203.11（+0.95%）<span class="muted"> 24 小时</span></div><div class="muted" style="margin-top:4px">3 分钟前同步</div></div>
 <div class="card">${chart()}<div class="seg" style="margin-top:8px">${[7,30,90].map(r=>`<button class="${st.range==r?'on':''}" data-set="range:${r}">${r} 天</button>`).join('')}</div></div>
 <div class="note tap" data-go="checklist" tabindex="0" role="button"><span>⚠</span><span style="flex:1">2 个钱包尚未备份</span><span>›</span></div>
 <div class="note red tap" data-go="sync" tabindex="0" role="button"><span>!</span><span style="flex:1">1 个账户同步失败</span><span>›</span></div>
 <div class="seg">${[['coin','按币种'],['acct','按账户'],['type','按类型']].map(([k,l])=>`<button class="${st.dist==k?'on':''}" data-set="dist:${k}">${l}</button>`).join('')}</div>
 <div class="list">${st.dist=='coin'?COINS.map(c=>`<div class="row tap" data-go="asset" tabindex="0" role="button"><div class="dot">${c[0].slice(0,3)}</div><div class="m"><b>${c[0]} <span class="muted num">${c[1]}</span></b><div class="share"><i style="width:${c[3]}%"></i></div></div><div class="r num">${usd(c[2])}<div class="muted">${c[3]}%</div></div></div>`).join('')
  :st.dist=='acct'?ACCTS.map(a=>`<div class="row tap" data-go="${a[3]}" tabindex="0" role="button"><div class="dot ${a[3]=='exchange'?'sq':''}">${a[0][0]}</div><div class="m"><b>${a[0]}</b><div class="share"><i style="width:${Math.round(a[2]/TOTAL*100)}%"></i></div></div><div class="r num">${usd(a[2])}<div class="muted">${Math.round(a[2]/TOTAL*100)}%</div></div></div>`).join('')
  :`<div class="row"><div class="dot sq">所</div><div class="m"><b>交易所</b><div class="share"><i style="width:63%"></i></div></div><div class="r num">${usd(81079.67)}<div class="muted">63%</div></div></div><div class="row"><div class="dot">链</div><div class="m"><b>链上钱包</b><div class="share"><i style="width:37%"></i></div></div><div class="r num">${usd(47370.65)}<div class="muted">37%</div></div></div>`}</div>
 <div class="muted" style="text-align:center">3 个币种无估值 · 已隐藏 12 个小额币种</div></div>`,

accounts:()=>bar('账户',{right:'<button class="ico" data-go="add" aria-label="添加账户">＋</button>'})+`<div class="body"><div class="seg"><button class="on">账户</button><button data-go="book">地址簿</button></div>
 <div class="sec">钱包</div><div class="list">${ACCTS.filter(a=>a[3]=='wallet').map(a=>row(a[0][0],a[0],a[1],`<div class="num">${usd(a[2])}</div><span class="pill ${a[4]}">${a[5]}</span>`,'wallet')).join('')}</div>
 <div class="sec">交易所</div><div class="list">${ACCTS.filter(a=>a[3]=='exchange').map(a=>row(a[0][0],a[0],a[4]?'<span class="down">同步失败 · 上次成功 2 小时前</span>':a[1],`<div class="num">${usd(a[2])}</div>`,'exchange',1)).join('')}</div>
 <div class="muted" style="text-align:center">长按账户可重命名或删除</div></div>`,

book:()=>bar('账户')+`<div class="body"><div class="seg"><button data-go="accounts">账户</button><button class="on">地址簿</button></div>
 <input class="in" id="q" placeholder="搜索地址、账户、备注"><div class="chips"><span class="chip on">全部链</span><span class="chip">EVM</span><span class="chip">Bitcoin</span><span class="chip">Solana</span><span class="chip">Tron</span></div>
 <div class="list">${row('EVM','<span class="num">0x12ab…9f3c</span>','Uni 钱包 · 6 条 EVM 链 · 保险库派生',chev,'wallet')}${row('SOL','<span class="num">7xKX…mN2q</span>','Uni 钱包 · Solana',chev,'wallet')}${row('BTC','<span class="num">bc1q…7k2m</span>','冷钱包 · 备注：长期持有',chev,'wallet')}${row('TRX','<span class="num">TQn9…Lw4e</span>','小狐狸主号 · Tron',chev,'wallet')}</div>
 <div class="note info">粘贴一个完整地址，可以查它是不是你的。没有匹配时会显示「不在你的地址簿中」。</div></div>`,

add:()=>bar('添加账户',{back:1})+`<div class="body"><div class="list">${row('看','观察链上地址','只需粘贴地址，不需要私钥',chev,'addwallet')}${row('所','连接交易所','使用只读 API Key',chev,'addex',1)}${row('钥','导入助记词或私钥','存入加密保险库，并自动生成观察地址',chev,'import',1)}</div></div>`,

addwallet:()=>bar('观察链上地址',{back:1})+`<div class="body"><div class="field"><label for="n1">账户名称</label><input class="in" id="n1" value="Uni 钱包"></div>

function render(){
  const id=stack[stack.length-1],tab=ROOT[id]?id:TABOF[id];
  clearInterval(timer);
  $('#phone').innerHTML=S[id]()+(tab?`<div class="tabs">${Object.entries(ROOT).map(([k,l])=>`<button class="${k==tab?'on':''}" data-go="${k}">${l}</button>`).join('')}</div>`:'');
  document.querySelectorAll('#idx button').forEach(b=>b.classList.toggle('on',b.dataset.go==id));
  $('#jump').value=id;
  if(id=='key'&&st.reveal){timer=setInterval(()=>{st.t--;const c=$('#cd');if(c)c.textContent=st.t;if(st.t<=0){st.reveal=false;st.t=60;render()}},1000)}
}
function go(id,fromIdx){if(!S[id])return;if(ROOT[id]||fromIdx)stack=[id];else stack.push(id);if(id!='key'){st.reveal=false;st.t=60}st.pin=0;render()}
$('#idx').innerHTML=PAGES.map(p=>`<button data-go="${p[0]}" data-idx="1"><span>${p[1]}</span>${p[2]}</button>`).join('');
$('#jump').innerHTML=PAGES.map(p=>`<option value="${p[0]}">${p[1]} ${p[2]}</option>`).join('');
$('#jump').addEventListener('change',e=>go(e.target.value,true));
function act(e){
  const t=e.target.closest('[data-go],[data-back],[data-set],[data-pin],[data-pinback]');if(!t)return;
  if(t.dataset.go){e.preventDefault();go(t.dataset.go,!!t.dataset.idx)}
  else if('back' in t.dataset){stack.length>1?stack.pop():stack=['overview'];st.reveal=false;render()}
  else if(t.dataset.set){const [k,v]=t.dataset.set.split(':');st[k]=k=='range'?+v:k=='reveal'?!!v:v;if(k=='reveal')st.t=60;render()}
  else if('pin' in t.dataset){st.pin++;if(st.pin>=6){go('overview')}else render()}
  else if('pinback' in t.dataset){st.pin=Math.max(0,st.pin-1);render()}
}
document.addEventListener('click',act);
document.addEventListener('keydown',e=>{if((e.key=='Enter'||e.key==' ')&&e.target.matches('[role=button]')){e.preventDefault();act(e)}});
render();
</script>
