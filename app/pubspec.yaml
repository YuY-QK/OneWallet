name: onewallet
description: OneWallet 应用。唯一依赖 Flutter 界面库的地方。
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  decimal: 3.2.6
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  drift: 2.35.4
  ow_application:
    path: ../packages/ow_application
  ow_chains:
    path: ../packages/ow_chains
  ow_data:
    path: ../packages/ow_data
  ow_domain:
    path: ../packages/ow_domain
  ow_net:
    path: ../packages/ow_net
  ow_platform:
    path: ../packages/ow_platform
  ow_pricing:
    path: ../packages/ow_pricing
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    # IBM Plex，SIL OFL 许可，许可文本见 assets/fonts/OFL.txt。
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
