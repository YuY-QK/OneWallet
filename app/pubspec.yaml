name: onewallet
description: OneWallet 应用。唯一依赖 Flutter 界面库的地方。
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  ow_domain:
    path: ../packages/ow_domain
  ow_platform:
    path: ../packages/ow_platform

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
